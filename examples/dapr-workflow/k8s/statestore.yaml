apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: ${NAMESPACE}
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "${REDIS_HOST}"
    - name: redisPassword
      value: "${REDIS_PASSWORD}"
    - name: actorStateStore
      value: "true"
scopes:
  - dapr-workflow
