apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: inventory-routing
  namespace: ${NAMESPACE}
spec:
  pubsubname: pubsub
  topic: inventory
  routes:
    rules:
      - match: "event.type == 'widget'"
        path: /widgets
      - match: "event.type == 'gadget'"
        path: /gadgets
    default: /products
scopes:
  - dapr-knative-pubsub
