apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dapr-knative-pubsub
  namespace: ${NAMESPACE}
  annotations:
    networking.knative.dev/ingress.class: kourier.ingress.networking.knative.dev
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        dapr.io/enabled: "true"
        dapr.io/app-id: "dapr-knative-pubsub"
        dapr.io/app-port: "3000"
        dapr.io/config: "dapr-knative-pubsub-config"
        dapr.io/metrics-port: "9092"
    spec:
      containers:
        - image: ${IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          env:
            - name: PUBSUB_NAME
              value: pubsub
            - name: TOPIC_NAME
              value: inventory
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
