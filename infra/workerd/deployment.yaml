apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: workerd
    app.kubernetes.io/instance: ${NAME}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app.kubernetes.io/name: workerd
      app.kubernetes.io/instance: ${NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workerd
        app.kubernetes.io/instance: ${NAME}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workerd
          image: "${NODE_IMAGE}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - exec npx --yes "workerd@${WORKERD_NPM_VERSION}" serve /etc/workerd/config.capnp
          env:
            - name: npm_config_cache
              value: /tmp/npm-cache
            - name: HOME
              value: /tmp
            - name: WORKERD_NPM_VERSION
              value: "${WORKERD_NPM_VERSION}"
          ports:
            - name: http
              containerPort: ${CONTAINER_PORT}
          volumeMounts:
            - name: config
              mountPath: /etc/workerd
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: ${CONFIG_MAP}
        - name: tmp
          emptyDir: {}
