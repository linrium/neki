apiVersion: v1
kind: ConfigMap
metadata:
  name: knative-function-router
  namespace: kong
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      upstream knative_kourier {
        server kourier.knative-serving.svc.cluster.local:80;
      }

      upstream restate_ingress {
        server restate.restate-test.svc.cluster.local:8080;
      }

      server {
        listen 8080;

        location = /__health {
          access_log off;
          return 200 "ok\n";
        }

        location = /functions {
          return 404;
        }

        location ~ ^/functions/knative-restate-go/restate(?<restate_api_path>/.*)?$ {
          set $target_path $restate_api_path;

          if ($target_path = "") {
            set $target_path "";
          }

          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix "/functions/knative-restate-go/restate";
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_pass http://restate_ingress/restate$target_path$is_args$args;
        }

        location ~ ^/functions/knative-restate-go(?<restate_handler_path>/.*)$ {
          set $target_path $restate_handler_path;

          if ($target_path = "") {
            return 404;
          }

          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix "/functions/knative-restate-go";
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_pass http://restate_ingress$target_path$is_args$args;
        }

        location ~ ^/functions/(?<function_name>[a-z0-9]([-a-z0-9]*[a-z0-9])?)(?<function_path>/.*)?$ {
          set $target_path $function_path;

          if ($target_path = "") {
            set $target_path "/";
          }

          proxy_http_version 1.1;
          proxy_set_header Host "$function_name.${FUNCTION_NAMESPACE}.${KNATIVE_DOMAIN}";
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix "/functions/$function_name";
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_pass http://knative_kourier$target_path$is_args$args;
        }

        location / {
          return 404;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knative-function-router
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knative-function-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knative-function-router
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__health
              port: http
          livenessProbe:
            httpGet:
              path: /__health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: knative-function-router
---
apiVersion: v1
kind: Service
metadata:
  name: knative-function-router
  namespace: kong
spec:
  selector:
    app.kubernetes.io/name: knative-function-router
  ports:
    - name: http
      port: 80
      targetPort: http
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: knative-functions
  namespace: kong
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /functions
      backendRefs:
        - group: ""
          kind: Service
          name: knative-function-router
          port: 80
