apiVersion: cluster.redpanda.com/v1alpha2
kind: Redpanda
metadata:
  name: redpanda
spec:
  chartRef: {}
  clusterSpec:
    image:
      repository: docker.io/redpandadata/redpanda

    statefulset:
      replicas: 1
      sideCars:
        image:
          repository: docker.io/redpandadata/redpanda-operator
      initContainers:
        setDataDirOwnership:
          enabled: true

    config:
      cluster:
        internal_topic_replication_factor: 1
        transaction_coordinator_replication: 1
        id_allocator_replication: 1

    storage:
      persistentVolume:
        enabled: true
        size: 100Gi

    resources:
      cpu:
        cores: 4
      memory:
        container:
          min: 10Gi
          max: 10Gi

    external:
      enabled: false

    listeners:
      kafka:
        port: 9093
        tls:
          enabled: true
      admin:
        port: 9644
        tls:
          enabled: true
      rpc:
        port: 33145
        tls:
          enabled: true
      schemaRegistry:
        enabled: true
        port: 8081
        tls:
          enabled: true

    console:
      enabled: true
      image:
        registry: docker.io
        repository: redpandadata/console
